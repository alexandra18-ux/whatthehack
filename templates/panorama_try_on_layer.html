<div class="panorama-try-on-layer">
  <div class="panorama-try-on-guide" role="group" aria-label="Границы стены" hidden>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon vector-effect="non-scaling-stroke"></polygon>
    </svg>
    {% for corner in "1234" %}
    <button class="panorama-wall-corner" type="button" aria-label="Угол рамки {{ corner }}"
            data-wall-corner="{{ forloop.counter0 }}"></button>
    {% endfor %}
  </div>
  <img class="panorama-try-on-artwork" alt="Примерка эскиза на стене" hidden>
</div>
