{% extends "base.html" %}
{% block title %}Восстановление пароля · Murrralium{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Восстановление пароля</h1>
  <form method="post" class="field-stack">
    {% csrf_token %}{{ form.as_p }}
    <button class="button lime" type="submit">Отправить ссылку</button>
  </form>
  <a class="back-link" href="{% url 'login' %}">Вернуться ко входу</a>
</section>
{% endblock %}
