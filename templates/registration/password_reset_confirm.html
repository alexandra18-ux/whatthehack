{% extends "base.html" %}
{% block title %}Новый пароль · Murrralium{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Новый пароль</h1>
  {% if validlink %}
  <form method="post" class="field-stack">
    {% csrf_token %}{{ form.as_p }}
    <button class="button lime" type="submit">Сохранить пароль</button>
  </form>
  {% else %}
  <p>Ссылка недействительна или срок её действия истёк.</p>
  <p><a class="back-link" href="{% url 'password_reset' %}">Запросить новую ссылку</a></p>
  {% endif %}
</section>
{% endblock %}
