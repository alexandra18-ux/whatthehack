<section class="rating-widget" aria-label="Оценка работы"{% if not in_feed %} id="rating"{% endif %}>
  {% include "rating_summary.html" %}
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'rate' project.pk %}" class="rating-form" aria-label="Оценить от 1 до 5">
    {% csrf_token %}
    {% if in_feed %}<input type="hidden" name="source" value="feed">{% endif %}
    {% with selected=project.viewer_score|default_if_none:""|stringformat:"s" %}
    {% for score in "12345" %}
    <button class="{% if selected and score <= selected %}is-rated{% endif %}" type="submit"
            name="score" value="{{ score }}" aria-label="Оценить на {{ score }} из 5"
            aria-pressed="{% if selected == score %}true{% else %}false{% endif %}"><span aria-hidden="true">{% if selected and score <= selected %}★{% else %}☆{% endif %}</span></button>
    {% endfor %}
    {% endwith %}
  </form>
  {% endif %}
</section>
