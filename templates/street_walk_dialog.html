<dialog id="street-walk-dialog" class="panorama-dialog street-walk-dialog panel" data-api-key="{{ yandex_panorama_key }}" aria-labelledby="street-walk-title">
  <header class="panorama-header">
    <h2 id="street-walk-title">Панорама улицы</h2>
    <form method="dialog"><button class="button outline compact">Закрыть</button></form>
  </header>
  <div class="street-walk-viewport">
    <div class="street-walk-player" aria-label="Интерактивная панорама Яндекс Карт"></div>
    <p class="street-walk-status" role="status">Загружаем панораму…</p>
  </div>
  <a class="button outline compact" data-street-walk-external target="_blank" rel="noopener noreferrer">Открыть в Яндекс Картах ↗</a>
</dialog>
