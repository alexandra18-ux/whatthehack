<div class="panorama-try-on-tools" hidden>
  <p class="editor-help" data-try-on-help>Перетащите углы рамки к краям стены. Выбранный угол можно двигать клавишами со стрелками.</p>
  <div class="address-actions">
    <button class="button lime compact" data-try-on-capture type="button">{{ capture_label }}</button>
    <div data-try-on-field hidden>
      {% if designs %}
      <label for="{{ prefix }}-catalog-sketch">Готовый эскиз</label>
      <select id="{{ prefix }}-catalog-sketch" data-try-on-catalog>
        <option value="">Выберите эскиз</option>
        {% for design in designs %}<option value="{% url 'asset' 'design' design.pk %}">{{ design.title }}</option>{% endfor %}
      </select>
      {% endif %}
      <label for="{{ prefix }}-sketch">Загрузить эскиз</label>
      <input id="{{ prefix }}-sketch" data-try-on-upload type="file" accept="image/png,image/jpeg">
    </div>
    <button class="button outline compact" data-try-on-toggle type="button" aria-pressed="true" hidden>Показывать эскиз</button>
  </div>
  <p class="editor-help" data-try-on-status role="status"></p>
</div>
