{% extends "base.html" %}{% load static %}
{% block content %}
<section class="hero">
  <div class="hero-copy">
    <p class="location"><span aria-hidden="true"></span>Саратов, Россия</p>
    <h1>Город<br>как <em>холст.</em></h1>
    <p class="hero-description">Примерьте мурал на фасад и покажите, как может измениться ваш город.</p>
    <a class="button lime" href="{% url 'map' %}">Выбрать здание</a>
  </div>
  <div class="hero-image">
    <img src="{% static 'images/mural-cat.png' %}" width="362" height="645" alt="Мурал с котом в цилиндре на фасаде здания в Саратове">
  </div>
</section>

<section id="projects" class="section" aria-label="Лента граффити">
  <header class="section-heading"><h2>Лента граффити</h2><a class="button outline" href="{% url 'map' %}">Смотреть на карте</a></header>
  {% include "feed.html" %}
</section>
{% endblock %}
