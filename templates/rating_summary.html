<p class="rating-summary">
  {% if show_rating_stars %}
  <span class="rating-stars" aria-hidden="true">☆☆☆☆☆<span class="rating-stars-fill" style="width: {% widthratio project.rating_average|default_if_none:0 5 100 %}%">★★★★★</span></span>
  {% endif %}
  {% if project.rating_count %}<strong>{{ project.rating_average|floatformat:1 }} из 5</strong><span> · всего оценок {{ project.rating_count }}</span>
  {% else %}Оценок пока нет{% endif %}
</p>
