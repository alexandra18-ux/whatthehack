{% extends "base.html" %}
{% block title %}Добавить здание · Muralium{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'map' %}">К карте</a>
<section class="panel auth-panel">
  <h1>Добавить здание</h1><p>Уточните адрес и координаты будущего мурала.</p>
  <form method="post" class="field-stack">
    {% csrf_token %}{{ form.as_p }}
    <button class="button lime">Перейти в редактор</button>
  </form>
</section>
{% endblock %}
